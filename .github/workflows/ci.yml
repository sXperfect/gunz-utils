name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: ["opened", "synchronize", "reopened", "ready_for_review"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12 compatibility interpreter
        id: py312
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up primary Python 3.11 interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check release metadata
        run: python scripts/release.py check

      - name: Install primary verification dependencies
        run: |
          python -m pip install pytest==9.0.3 ruff==0.14.10 mypy==1.19.1
          python -m pip install ".[all,plot,docs]"

      - name: Install Python 3.12 compatibility dependencies
        run: |
          "${{ steps.py312.outputs.python-path }}" -m pip install pytest==9.0.3
          "${{ steps.py312.outputs.python-path }}" -m pip install ".[all]"

      - name: Run aggregate repository verification
        run: |
          python scripts/audit_ci.py \
            --skip-release \
            --compat-python "${{ steps.py312.outputs.python-path }}" \
            --summary-json tmp/ci-summary.json

      - name: Upload verification summary
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-verification-summary
          path: tmp/ci-summary.json
          if-no-files-found: warn
          retention-days: 14
