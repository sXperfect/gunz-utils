name: CI

on:
  push:
    # TEMPORARY pre-PR validation trigger; remove after this hosted run.
    branches: ["main", "feat/ci-release-management"]
  pull_request:
    branches: ["main"]
    types: ["opened", "synchronize", "reopened", "ready_for_review"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check release metadata
        run: python scripts/release.py check

      - name: Install CI dependencies
        run: |
          python -m pip install pytest==9.0.2 ruff==0.14.10 mypy==1.19.1
          python -m pip install ".[all,plot,docs]"

      - name: Run Ruff
        run: python -m ruff check src tests benchmarks scripts

      - name: Run mypy
        run: python -m mypy src/gunz_utils

      - name: Run full pytest on Python 3.11
        run: python -m pytest

      - name: Build documentation strictly
        run: python scripts/ci.py docs

      - name: Run packaging and dependency isolation
        run: python scripts/ci.py packaging

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python 3.12 compatibility dependencies
        run: |
          python -m pip install pytest==9.0.2
          python -m pip install ".[all]"

      - name: Run full pytest on Python 3.12
        run: python -m pytest
