name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: ["opened", "synchronize", "reopened", "ready_for_review"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12 compatibility interpreter
        id: py312
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up primary Python 3.11 interpreter
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install primary verification dependencies
        run: |
          python -m pip install pytest==9.0.2 ruff==0.14.10 mypy==1.19.1
          python -m pip install ".[all,plot,docs]"

      - name: Install Python 3.12 compatibility dependencies
        run: |
          "${{ steps.py312.outputs.python-path }}" -m pip install pytest==9.0.2
          "${{ steps.py312.outputs.python-path }}" -m pip install ".[all]"

      - name: Run aggregate repository verification
        run: |
          python scripts/audit_ci.py --compat-python "${{ steps.py312.outputs.python-path }}" --summary-json tmp/ci-summary.json

      - name: Upload verification summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-verification-summary
          path: tmp/ci-summary.json
          if-no-files-found: warn
          retention-days: 14
