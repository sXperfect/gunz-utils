[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gunz-utils"
version = "1.10.0"
description = "General purpose utilities for Python projects"
authors = [
  { name = "Yeremia Gunawan Adhisantoso", email = "adhisant@tnt.uni-hannover.de" },
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
validation = ["pydantic>=2.0.0"]
project = ["gitpython>=3.1.0"]
observability = ["loguru>=0.7.0"]
secure = ["cryptography>=42.0.0"]
plot = ["matplotlib>=3.8.0"]
all = [
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "gitpython>=3.1.0",
    "loguru>=0.7.0",
]
docs = [
    "sphinx",
    "myst-parser",
    "sphinx-autodoc-typehints",
    "sphinx_rtd_theme",
]

[project.urls]
"Homepage" = "https://github.com/sXperfect/gunz-utils"
"Bug Tracker" = "https://github.com/sXperfect/gunz-utils/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gunz_utils"]

[tool.hatch.build.targets.sdist]
include = ["src/"]

# --- Ruff (linter + formatter) ----------------------------------------------
# AGENTS.md §2.6 mandates Ruff linting; ruff format is intentionally excluded.
[tool.ruff]
# Project requires Python 3.11+.
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# F (Pyflakes) + E/W (pycodestyle) + I (isort) + UP (pyupgrade) + B (bugbear)
select = ["F", "E", "W", "I", "UP", "B"]
# Allow assert in tests; the security guide forbids assert in production code,
# so we tighten with a per-file override below.
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to use `assert` (the unittest idiom) and re-export
# private helpers from src/ via leading-underscore imports.
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# --- Pytest ------------------------------------------------------------------
# src-layout: ``src/`` is on sys.path so ``pytest`` works without ``pip install -e .``
# AGENTS.md §2.5 declares pytest as the canonical test runner.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

# --- mypy --------------------------------------------------------------------
# Static type checking. Targets Python 3.11 (see requires-python above).
# We use ``disallow_untyped_defs`` over full ``--strict`` because the codebase
# still has untyped third-party imports (gitpython) and intentionally Any-heavy
# call sites in protocol/boundary code (ext.* backends).
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
# Enforce per-module overrides below; CI runs ``mypy src/gunz_utils`` and gates
# on Success.
[[tool.mypy.overrides]]
# Ext backends depend on heavy third-party libs; allow implicit Any from them.
module = [
    "git",
    "gitpython",
    "loguru",
    "pydantic",
    "pydantic_core",
    "cryptography",
]
ignore_missing_imports = true
