[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gunz-utils"
version = "1.11.0"
description = "Dependency-free Python utility primitives for reliable, reusable systems"
license = "BSD-3-Clause-Clear"
license-files = ["LICENSE.md"]
keywords = ["utilities", "reproducibility", "benchmarking", "resilience", "security"]
authors = [
  { name = "Yeremia Gunawan Adhisantoso", email = "yeremiag@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
validation = ["pydantic>=2.4.0"]
project = ["gitpython>=3.1.62"]
observability = ["loguru>=0.7.0"]
secure = ["cryptography>=50.0.1"]
plot = ["matplotlib>=3.10.9"]
all = [
    "pydantic>=2.4.0",
    "cryptography>=50.0.1",
    "gitpython>=3.1.62",
    "loguru>=0.7.0",
]
docs = [
    "sphinx",
    "myst-parser",
    "sphinx-autodoc-typehints",
    "sphinx_rtd_theme",
]

[project.urls]
"Homepage" = "https://github.com/sXperfect/gunz-utils"
"Source" = "https://github.com/sXperfect/gunz-utils"
"Issues" = "https://github.com/sXperfect/gunz-utils/issues"
"Changelog" = "https://github.com/sXperfect/gunz-utils/blob/main/CHANGELOG.md"
"Security" = "https://github.com/sXperfect/gunz-utils/blob/main/SECURITY.md"
"Documentation" = "https://github.com/sXperfect/gunz-utils/tree/main/docs/source"

[tool.hatch.build.targets.wheel]
packages = ["src/gunz_utils"]

[tool.hatch.build.targets.sdist]
include = ["src/"]

# --- Ruff (linter + formatter) ----------------------------------------------
# Ruff linting is part of the canonical local/CI gate; formatting is intentionally excluded.
[tool.ruff]
# Project requires Python 3.11+.
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# F (Pyflakes) + E/W (pycodestyle) + I (isort) + UP (pyupgrade) + B (bugbear)
select = ["F", "E", "W", "I", "UP", "B"]
# Tests may use assert; AGENTS.md forbids assert as production runtime validation.
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to use `assert` (the unittest idiom) and re-export
# private helpers from src/ via leading-underscore imports.
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# --- Pytest ------------------------------------------------------------------
# src-layout: ``src/`` is on sys.path so ``pytest`` works without ``pip install -e .``
# Pytest is the canonical test runner.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

# --- mypy --------------------------------------------------------------------
# Static type checking. Targets Python 3.11 (see requires-python above).
# We use ``disallow_untyped_defs`` over full ``--strict`` because the codebase
# still has untyped third-party imports (gitpython) and intentionally Any-heavy
# call sites in protocol/boundary code (ext.* backends).
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
# Enforce per-module overrides below; CI runs ``mypy src/gunz_utils`` and gates
# on Success.
[[tool.mypy.overrides]]
# Ext backends depend on heavy third-party libs; allow implicit Any from them.
module = [
    "git",
    "gitpython",
    "loguru",
    "pydantic",
    "pydantic_core",
    "cryptography",
]
ignore_missing_imports = true
