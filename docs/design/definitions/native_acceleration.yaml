component: "NativeAcceleration"
type: "SubsystemArchitecture"
purpose: |
  Defines the optional C/C++ native acceleration architecture for gunz-utils.
  Ensures that reference implementations remain pure Python while unlocking
  orders-of-magnitude reduction in latency and allocations for high-throughput
  binary deserialization (varints), canonical JSON streaming, and structural diffs.
  Note: Benchmarking, hardware cycle timing, and telemetry samplers are
  consolidated in `gunz-bench` (native/src/_native_ext.c).
modules:
  - name: "gunz_utils._accel"
    type: "NativeExtension"
    status: "Optional"
    functions:
      - name: "encode_uvarint"
        args: ["value"]
        returns: "bytes"
        description: "Encodes unsigned 64-bit integer into canonical variable-length bytes in C."
      - name: "decode_uvarint"
        args: ["buffer", "offset"]
        returns: "Tuple[int, int]"
        description: "Zero-copy reads canonical unsigned 64-bit varint, returning (value, new_offset)."
      - name: "has_accel"
        args: []
        returns: "bool"
        description: "Returns True indicating compiled C acceleration is loaded."

  - name: "gunz_utils.binary"
    type: "PythonModule"
    classes:
      - name: "ByteReader"
        methods:
          - name: "read_uvarint"
            args: []
            returns: "int"
    functions:
      - name: "encode_uvarint"
        args: ["value"]
        returns: "bytes"
