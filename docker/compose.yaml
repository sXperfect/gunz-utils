name: gunz-utils
services:
  gunz-utils:
    image: gunz-utils:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ../:/app:ro
    command: ["micromamba", "run", "-n", "base", "python", "-m", "pytest", "-m", "not slow", "-q"]
